<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Переводчик</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 4px 20px rgba(0,0,0,0.1);
            width: 400px;
            text-align: center;
        }
        input[type=text], select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: none;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .translated {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            background-color: #e8f5e9;
            min-height: 50px;
        }
        .logout {
            margin-top: 20px;
        }
        .logout a {
            color: #FF4B5C;
            text-decoration: none;
        }
        .logout a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Переводчик</h2>
        <form method="POST">
            <input type="text" name="text" placeholder="Введите текст" required>
            
            <!-- Выбор языка -->
            <label for="from_lang">С языка:</label>
            <select name="from_lang" id="from_lang">
                <option value="auto">Авто</option>
                <option value="en">Английский</option>
                <option value="ru">Русский</option>
                <option value="fr">Французский</option>
                <option value="de">Немецкий</option>
                <option value="es">Испанский</option>
            </select>

            <label for="to_lang">На язык:</label>
            <select name="to_lang" id="to_lang">
                <option value="en">Английский</option>
                <option value="ru">Русский</option>
                <option value="fr">Французский</option>
                <option value="de">Немецкий</option>
                <option value="es">Испанский</option>
            </select>

            <button type="submit">Перевести</button>
        </form>

        <div class="translated">
            {% if translated %}
                <strong>Перевод:</strong> {{ translated }}
            {% endif %}
        </div>

        {% if history %}
        <h3>История переводов</h3>
        <ul>
            {% for item in history %}
                <li>{{ item.source_text }} → {{ item.translated_text }} ({{ item.from_lang }} → {{ item.to_lang }})</li>
            {% endfor %}
        </ul>
        {% endif %}

        <div class="logout">
            <a href="{{ url_for('logout') }}">Выйти</a>
        </div>
    </div>
</body>
</html>
